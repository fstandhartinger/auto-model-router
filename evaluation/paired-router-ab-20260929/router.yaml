# Frozen study configuration; generated from the current API-routable catalog.
# API secret values are never stored here; only the environment-variable name.
enabled: [opus-5.5-api, sonnet-5-api, gpt-6-luna, gpt-6-astra, glm-5.3-flash]

providers:
  openrouter:
    base_url: https://openrouter.ai/api/v1
    api_key_env: OPENROUTER_API_KEY
    cache: generic

policy:
  name: F_expected
  classifier:
    backend: local-route-head
    model: /home/flori/jobs/router-ab-measurement-20260929/work/model/weiche-395m
    variant: fp16
    threads: 2
  verify:
    enabled: false
    judge: none

models:
