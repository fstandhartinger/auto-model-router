# Example provider configuration. Copy it, keep your copy out of version control
# (*.local.yaml is git-ignored) and point AUTO_ROUTER_CONFIG at it.
# API keys are referenced by environment variable name only.

providers:
  openrouter:
    base_url: https://openrouter.ai/api/v1
    api_key_env: OPENROUTER_API_KEY
    cache: openai
  some-free-host:
    base_url: https://llm.example.com/v1
    api_key_env: EXAMPLE_API_KEY
    cache: generic

subscriptions:
  # Flat-rate plan used through its official client (Claude Code via the shim).
  claude:
    budget_file: ~/.agent-budget.json   # {"claude": {"week_percent": .., "session_percent": .., "week_resets_at": ..}}
    weekly_reserve: 0.65
    hard_stop: 0.80

policy:
  name: F_expected
  # Default: private CPU inference. `hosted` uses TypeSafe/Jev with
  # TYPESAFE_API_KEY; `heuristic` makes no classifier call.
  classifier:
    backend: local
    model: convaiinnovations/laya
    threads: 4
  escalate_after_tool_errors: 3
  # Jev reports difficulty on a compressed scale; map it back to 0..1 (measured on our task set)
  jev_difficulty_calibration: [0.27, 0.51]
  success:
    table: examples/success.measured.json   # measured rates beat benchmark-derived curves

  # Check a cheap route's answer with Jev before returning it, and escalate when
  # it falls short. Only the tier the judge was measured on: the ceilings below
  # keep a frontier route - free or not - out of it, because a judge that is not
  # stronger than what it grades produces false alarms, not quality.
  verify:
    enabled: true
    max_price_per_mtok: 1.0        # blended 80/20 list price; free routes are 0
    max_capability: 72             # per-category, after the evidence discount
    thresholds: {default: 0.30, coding: 0.30, math: 0.30}
    # Measured at those thresholds (experiments/verify_calibrate.py). The cost
    # model uses them: a cheap route whose failures are caught cheaply is worth
    # more than one whose failures reach the user.
    catch_rate: {coding: 0.85, math: 0.67}
    false_flag_rate: {coding: 0.0, math: 0.0}
    skip_categories: [long_context]  # the judge cannot see the document
    max_request_chars: 6000
    carry_failed_attempt: false      # a failed cheap answer anchors the retry
    judge_usd: 0.0004
    judge_seconds: 0.6

models:
  - name: small-free
    provider: some-free-host
    upstream_id: vendor/small-model
    bench_id: small-model::default
    free: true
    cache: {ttl_seconds: 300, hit_rate: 0.5}   # measure this

  - name: mid
    provider: openrouter
    upstream_id: vendor/mid-model
    bench_id: mid-model::high
    bench_offer: {platform: OpenRouter}
    cache: {hit_rate: 0.9}

  - name: frontier
    provider: openrouter
    upstream_id: anthropic/claude-opus-5
    bench_id: claude-opus-5::high
    bench_offer: {platform: OpenRouter, provider: Anthropic}
    cache_family: anthropic
    vision: true

  - name: frontier-subscription
    provider: anthropic
    upstream_id: claude-opus-5
    bench_id: claude-opus-5::high
    subscription: claude
    list_price_model: frontier            # shadow price reference when quota gets tight
    cache_family: anthropic
    vision: true
